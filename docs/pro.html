        // Function to render courses
        function renderCourses(coursesToRender) {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';
            
            coursesToRender.forEach(course => {
                const courseCard = document.createElement('div');
                courseCard.className = 'course-card';
                courseCard.innerHTML = `
                    <div class="course-header">
                        <div class="course-number">${course.id}</div>
                        <div class="course-category">${course.category.toUpperCase()}</div>
                    </div>
                    <div class="course-body">
                        <h3 class="course-title">${course.title}</h3>
                        <a href="${course.url}" class="course-link" target="_blank">Access Course</a>
                    </div>
                `;
                container.appendChild(courseCard);
            });
        }

        // Function to search courses
        function searchCourses() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const activeCategory = document.querySelector('.filter-btn.active').dataset.category;
            
            let filteredCourses = courses;
            
            // Filter by category
            if (activeCategory !== 'all') {
                filteredCourses = filteredCourses.filter(course => course.category === activeCategory);
            }
            
            // Filter by search term
            if (searchTerm) {
                filteredCourses = filteredCourses.filter(course => 
                    course.title.toLowerCase().includes(searchTerm)
                );
            }
            
            renderCourses(filteredCourses);
        }

        // Initialize with all courses
        renderCourses(courses);

        // Add event listeners to filter buttons
        document.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                searchCourses();
            });
        });

        // Add event listener to search input for real-time search
        document.getElementById('searchInput').addEventListener('input', searchCourses);
    </script>
